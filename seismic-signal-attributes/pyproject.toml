[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-signal-attributes"
version = "1.0.0"
description = "Kurtosis characteristic functions, onset picking, gain and correlation attributes for seismic receiver traces"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "obspy>=1.4",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
seismic-signal-attributes = "seismic_signal_attributes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
