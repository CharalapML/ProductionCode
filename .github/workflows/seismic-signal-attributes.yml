name: seismic-signal-attributes tests

on:
  push:
    paths:
      - "seismic-signal-attributes/**"
      - ".github/workflows/seismic-signal-attributes.yml"
  pull_request:
    paths:
      - "seismic-signal-attributes/**"
      - ".github/workflows/seismic-signal-attributes.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seismic-signal-attributes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
